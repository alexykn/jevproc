name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python }}
      - name: Install development environment
        run: uv sync --python '${{ matrix.python }}'
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Type-check project
        run: uv run --no-sync ty check
      - name: Radon complexity report
        run: uv run --no-sync radon cc src -s -a
      - name: Contract and collector tests (no API keys)
        run: uv run --no-sync pytest -q
      - name: Offline behavior fingerprints (synthetic HTTP only)
        env:
          PYTHONPATH: src
        run: uv run --no-sync python tools/behavior_fingerprint.py
      - name: Compile source
        run: uv run --no-sync python -m compileall -q src
      - name: Build wheel and source distribution
        run: uv run --no-sync python -m build
      - name: Test the installed wheel outside the checkout
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/jevproc-wheel" --python '${{ matrix.python }}'
          uv pip install --python "$RUNNER_TEMP/jevproc-wheel/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/jevproc-wheel/bin/python" "$GITHUB_WORKSPACE/tools/wheel_smoke.py"
