name: Architecture refactor preparation
on:
  push:
    branches: [work/architecture-refactor-build]
    paths: ['tools/_architecture_*.py', '.github/workflows/architecture-build.yml']
permissions:
  contents: write
concurrency:
  group: jevproc-architecture-preparation
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/work/architecture-refactor-build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
          python-version: '3.12'
      - name: Baseline tests and deterministic contracts
        run: |
          uv sync --python 3.12
          uv run --no-sync pytest -q
          PYTHONPATH=src uv run --no-sync python tools/_architecture_contract.py > /tmp/jevproc-before.json
          cat /tmp/jevproc-before.json
          uv run --no-sync radon cc src -j > /tmp/jevproc-radon-before.json
          uv run --no-sync ruff check src --output-format json > /tmp/jevproc-ruff-before.json || true
          uv run --no-sync ty check src > /tmp/jevproc-ty-before.txt 2>&1 || true
          cp tools/_architecture_contract.py /tmp/jevproc-contract.py
      - name: Apply cohesive refactor and format changed Python files
        run: |
          uv run --no-sync python tools/_architecture_refactor.py
          uv run --no-sync python tools/_architecture_refine.py
          uv run --no-sync python - <<'PY'
          import json, subprocess
          paths = [p for p in json.load(open('/tmp/jevproc-refactor-files.json')) if p.endswith('.py')]
          subprocess.run(['uv','run','--no-sync','ruff','check','--isolated','--target-version','py312','--select','F401,I','--fix',*paths],check=True)
          subprocess.run(['uv','run','--no-sync','ruff','format',*paths],check=True)
          PY
          uv run --no-sync python -m compileall -q src
      - name: Verify behavioral equivalence and regressions
        run: |
          PYTHONPATH=src uv run --no-sync python /tmp/jevproc-contract.py > /tmp/jevproc-after.json
          cat /tmp/jevproc-after.json
          diff -u /tmp/jevproc-before.json /tmp/jevproc-after.json
          uv run --no-sync pytest -q
          uv run --no-sync python -m build
          uv venv /tmp/jevproc-refactor-wheel --python 3.12
          uv pip install --python /tmp/jevproc-refactor-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/jevproc-refactor-wheel/bin/python "$GITHUB_WORKSPACE/tools/wheel_smoke.py"
      - name: Record static analysis without hiding baseline diagnostics
        run: |
          uv run --no-sync radon cc src -j > /tmp/jevproc-radon-after.json
          uv run --no-sync ruff check src --output-format json > /tmp/jevproc-ruff-after.json || true
          uv run --no-sync ty check src > /tmp/jevproc-ty-after.txt 2>&1 || true
          cat /tmp/jevproc-ty-after.txt
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          def blocks(report):
              found={}
              for path, items in report.items():
                  for item in items:
                      for row in (item.get('methods', []) if item['type'] == 'class' else [item]):
                          found[(path,row['lineno'],row['name'])]=row
              return found
          targets={'_run','judge','load_config','redact_argv','_post','evaluate','_evaluate','scan','_file_info','_process','attach_ancestry','_child_index','__init__'}
          for when in ('before','after'):
              rows=blocks(json.load(open(f'/tmp/jevproc-radon-{when}.json')))
              print('RADON',when,'max=',max(row['complexity'] for row in rows.values()))
              for (path,_,name),row in rows.items():
                  if name in targets:
                      print(path,name,row['complexity'])
              diagnostics=json.load(open(f'/tmp/jevproc-ruff-{when}.json'))
              print('RUFF',when,len(diagnostics))
              for d in diagnostics:
                  print(Path(d['filename']).relative_to(Path.cwd()),d['location']['row'],d['code'],d['message'])
          PY
      - name: Publish tested source as one commit on a separate feature branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          rm tools/_architecture_*.py .github/workflows/architecture-build.yml
          git add -A
          git diff --cached --stat 4ba6a91a51517b09f6ace90f5d0eaa2f11532596
          TREE=$(git write-tree)
          COMMIT=$(printf 'refactor: give evidence, experiments and policy clear ownership\n' | git commit-tree "$TREE" -p 4ba6a91a51517b09f6ace90f5d0eaa2f11532596)
          git push origin "$COMMIT:refs/heads/refactor/maintainable-core"
          echo "Refactor commit: $COMMIT"
