name: One-shot refactor lint cleanup
on:
  push:
    branches: [refactor/radon-complexity-budget]
    paths: ['.github/workflows/refactor-lint-cleanup.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/radon-complexity-budget
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
          python-version: '3.12'
      - run: uv sync --python 3.12
      - run: uv run --no-sync ruff check . --fix
      - name: Publish cleanup and remove this workflow
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          rm .github/workflows/refactor-lint-cleanup.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: apply Ruff import cleanup"
          git push origin HEAD:refactor/radon-complexity-budget
