schema_version: 1
host_context: >-
  General-purpose Unix workstation or server. Its exact purpose is unknown.
  Developer tools, package managers, interpreters, containers and administrative
  shells may be legitimate. Unusual does not mean malicious.
jev:
  model: jev-1.13.0
  concurrency: 16
  requests_per_minute: 0
  timeout_seconds: 30
  retries: 2
  max_retry_delay: 30
  max_requests: 1000
collection:
  max_processes: 2048
  ancestry_depth: 4
  connections: true
  command_line: false
  hashes: false
  signatures: false
  max_hash_bytes: 67108864
cache:
  enabled: true
  ttl_seconds: 60
  max_entries: 4096
ignore: []
rulesets:
  process:
    - id: JPR001
      title: Process risk
      message: Review the executable, invocation, parent context and observed sockets before taking action. This is model-assisted triage, not a malware verdict.
      question:
        type: noul
        instructions: >-
          Does the explicitly bound process instance have concrete evidence of
          malicious or abusive behavior in this snapshot? Judge the whole observed
          context together. Select high probability only for evidence of misuse,
          not merely an unfamiliar name, unusual path, unsigned binary, interpreter,
          root ownership, temporary directory, unknown IP address, or missing data.
          Legitimate software can be abused, and unusual software can be benign.
          Do not invent event history, reputation, persistence, user consent,
          script contents, network direction, traffic contents, or intent.
      policy:
        warning_at: 0.10
        uncertain_at: 0.08
